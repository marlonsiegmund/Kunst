<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title> Marlon Siegmund </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
   :root {
      --schwarz: #0f0f0f;
      --weiss: #f8f7f4;
      --grau: #999;
    }
    .nav-name {
      font-size: 30px
    }
    nav {
     position: fixed;
     left: 0;
     right: 0;
     top: 0;
      display: flex;
      justify-content: space-between; 
      align-items: center;
      padding: 14px 48px;
      font-family: Elms Sans, Ital;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 30px
    }
    nav a {
      text-decoration: none;
      color: var(--schwarz);
      font-size: 26px;
    }
    nav a:hover {
      color: var(--grau);
    }
    main {
      margin-top: 100px;
    }
    main img {
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: cover;
      display: block;
    }
    p {
      font-family: Elms Sans, Ital;
      font-size: 18;
      text-align: center;
    }
    p:hover {
      color: var(--grau);
    }
    }
    </style> 
    </head>
<body>
  <nav>
    <span class="nav-name">marlon siegmund</span>
    <ul>
      <li><a href="#">ARCHIVE</a></li>
      <li><a href="#">ABOUT</a></li>
    </ul>
  </nav> 
  <main>
    <img src="Oskar-Hoffmann-Strasse.jpg">
  </main>
  <p>SCHLUSSLICHT, 2024-2026</p>
</body>
</html>
